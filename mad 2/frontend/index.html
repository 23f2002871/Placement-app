<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Placement System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://unpkg.com/vue-router@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body class="bg-light">
    
    <div id="app">
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
            <div class="container-fluid">
                <a class="navbar-brand" href="#">Placement Portal Application</a>
                <div class="d-flex">
                    <button v-if="userIsLoggedIn" @click="handleLogout" class="btn btn-outline-light">Logout</button>
                    <router-link v-if="!userIsLoggedIn && $route.path !== '/register'" to="/register" class="btn btn-outline-light ms-2">Register</router-link>
                    <router-link v-if="!userIsLoggedIn && $route.path === '/register'" to="/" class="btn btn-outline-light ms-2">Login</router-link>
                </div>
            </div>
        </nav>
        <div class="container pb-5">
            <router-view></router-view>
        </div>
    </div>

    <script src="/static/app.js"></script>
    
</body>
</html>
